/**
 * Render.yaml deployment blueprint for GenMed
 * Deploys Backend Express API Service & Frontend Static Web Service
 */

services:
  # ── Backend Web Service ───────────────────────────────────────────────────────
  - type: web
    name: genmed-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # ── Frontend Web Service ──────────────────────────────────────────────────────
  - type: web
    name: genmed-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: genmed-backend
          property: host
